# Ebner et al. 2019 protocols whose source preparation is L2/3 PC -> L5 TTPC:
#   Letzkus 2006 (200 Hz bursts; proximal/distal split per pair after the run, from apical path distance
#   and basis EPSP rise time vs Letzkus' 2.7 ms median) and the distal row of sjostrom_50hz_dt+10ms
#   (Sjostrom & Hausser 2006). Pair geometry as configs/L23PC_L5TTPC_STDP.yaml.
# Own label (own sims folder, calibration cache and index); the L5-L5 Ebner/Sabrina set is untouched.
# prefire_only false: prefire (pairing only) AND full-protocol (C01 + pairing + C02) configs per workdir.
#
# dt convention: dt > 0 = pre before post, measured to the first postsynaptic AP (dt_ref "ap"),
# i.e. dt = paper's delta t' (EPSP onset to first AP of the burst), for all protocols here.
# Experimental targets: ebner/ebner_targets.csv (synapse_location proximal/distal).
label: Ebner2019_L23PC_L5TTPC
reference: Ebner et al. 2019 (Letzkus 2006; Sjostrom & Hausser 2006)
seed: 20262009
npairs: 120
prefire_only: false  # C01/C02 test pulses written too: EPSP basis + full-protocol delta-cooker check (2026-09-29)
circuit:
    pre_simwriter_config: "/home/dhuruva/ws/plastyfire/data/dhuruva_modified_ion_channels_circuit_config_pre_cell_selection.json"
    config: "/home/dhuruva/ws/plastyfire/data/dhuruva_delta_circuit_config.json"  # delta emodels; also used for calibration
    node_set: "/project/rrg-emuller/datasets/SSCx_plasticity/O1_2023a_Ecker/node_sets.json"
    target: "hex_O1Excitatory"
    node_pop: "S1nonbarrel_neurons"
    edge_pop: "S1nonbarrel_neurons__S1nonbarrel_neurons__chemical"
pregid_conf:
    mtype: ["L2_TPC:A", "L2_TPC:B", "L3_TPC:A", "L3_TPC:B"]
postgid_conf:
    mtype: ["L5_TPC:A", "L5_TPC:B"]
geom_cons:
    max_dist: [50., 700., 10.]  # [x, y, z] um
sims_dir: "/home/dhuruva/ws/plastyfire/refitting_results"
simulator:
    account: "rrg-emuller"
    env: "/home/dhuruva/ws/plastyfire/setupenv.sh"
    run: "/home/dhuruva/ws/plastyfire/plastyfire/pairrunner.py"
stimulus:  # defaults for the protocols below
    freq: [10.0]  # Hz
    amp: "find"  # nA
    amp_min: 0.5
    amp_max: 3.0
    amp_lev: 10
    nspikes: 5
    dt: [10.0]  # ms
    width: 3.0
    T: 10000  # ms, 0.1 Hz pairing repetition
    offset: 1000  # ms
    nreps: 15
    C01_duration: 4  # min
    C02_duration: 4  # min
protocols:
    # --- Sjostrom & Hausser 2006 distal L2/3 -> L5 inputs (Ebner Fig 2B right), same protocol as Sjostrom 2001 ---
    # Source-paper settings (not Ebner's): post APs by 5 ms pulses (S&H 2006 Methods: 5 ms, 1.0-1.8 nA);
    # 5 pre + 5 post at 50 Hz, pre leads by 10 ms, 15x every 10 s
    - {id: sjostrom_50hz_dt+10ms, freq: 50., dt: 10., width: 5.}
    # --- Letzkus 2006 (Ebner Fig 4): 1 pre + 3 APs at 200 Hz (2 ms pulses, paper: 3-5 nA) ---
    # Source-paper pairing, not Ebner's 0.1 Hz: "pairing presynaptic and postsynaptic APs 100-200 times at 1 Hz"
    # (Methods; no per-figure count given) -> 100 pairings at 1 Hz (T = 1000 ms)
    # Spike count is not monotonic in amp at 200 Hz (low amps give late Ca2+ burst spikes), so the plain search
    # rejected 37/120 cells at 2 or 3 ms; burst_window_search counts only in-burst APs and allows later spikes
    # single AP +10 ms (Letzkus 2006 Results: 0.72 +- 0.03, n=15, pooled over locations; LTD grows with rise time)
    - {id: letzkus_1ap_dt+10ms, n_pre: 1, n_post: 1, freq: 200., dt: 10., nreps: 100, T: 1000, width: 2.,
       amp_min: 1., amp_max: 8., amp_lev: 150}
    - {id: letzkus_3ap_200hz_dt+10ms, n_pre: 1, n_post: 3, freq: 200., dt: 10., nreps: 100, T: 1000, width: 2.,
       amp_min: 1., amp_max: 8., amp_lev: 150, burst_window_search: true}
    # -10 ms = burst onset (first AP) 10 ms before the EPSP, so the last AP coincides with it
    # (Letzkus 2006: "the EPSP coincides with the last and smallest backpropagating AP")
    - {id: letzkus_3ap_200hz_dt-10ms, n_pre: 1, n_post: 3, freq: 200., dt: -10., nreps: 100, T: 1000,
       width: 2., amp_min: 1., amp_max: 8., amp_lev: 150,
       burst_window_search: true}
